<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QURISE Quantum Jeopardy</title>
<style>
:root{--bg:#f3f7f3;--ink:#12261a;--g1:#1b5e3a;--g2:#2e7d4f;--g3:#cfe5d6;--line:#9bbfa8;--bad:#9b2c2c}
*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--g1);color:#fff}
header h1{margin:0;font-size:20px;font-weight:700}
button{font:inherit;cursor:pointer;border:2px solid var(--g1);background:#fff;color:var(--g1);padding:6px 12px}
button:hover{background:var(--g3)}
button.solid{background:var(--g1);color:#fff}button.solid:hover{background:var(--g2)}
header button{border-color:#fff;background:transparent;color:#fff}header button:hover{background:var(--g2)}
main{flex:1;padding:16px 20px}
#board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cat{background:var(--g1);color:#fff;padding:14px 6px;text-align:center;font-weight:700;min-height:64px;display:flex;align-items:center;justify-content:center}
.tile{background:var(--g2);color:#fff;border:2px solid var(--g1);font-size:clamp(20px,3.2vw,36px);font-weight:700;height:clamp(60px,11vh,100px)}
.tile:hover{background:var(--g1)}
.tile.used{background:var(--g3);color:var(--line);border-color:var(--line)}
.tile.used:hover{background:#e3f0e7}
#teams{display:flex;gap:10px;flex-wrap:wrap;padding:12px 20px;border-top:2px solid var(--g1);background:#fff;align-items:stretch}
.team{border:2px solid var(--g1);padding:8px;min-width:170px;display:flex;flex-direction:column;gap:6px}
.team input.name{border:0;border-bottom:1px solid var(--line);font:inherit;font-weight:700;width:100%;background:transparent}
.score{font-size:26px;font-weight:700}
.row{display:flex;gap:4px;align-items:center}
.row button{padding:2px 8px;font-size:13px}
#ov{position:fixed;inset:0;background:var(--g1);color:#fff;display:none;flex-direction:column;padding:20px;z-index:5}
#ov.on{display:flex}
#ov .top{display:flex;justify-content:space-between;font-size:18px}
#ov button{border-color:#fff;background:transparent;color:#fff}#ov button:hover{background:var(--g2)}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;cursor:pointer;padding:10px}
#stage .txt{font-size:clamp(24px,4.5vw,52px);font-weight:700;max-width:1000px;line-height:1.25}
#stage .ans{font-size:clamp(20px,3.5vw,38px);background:#fff;color:var(--g1);padding:12px 20px}
#stage .hint{font-size:14px;opacity:.8}
#score{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding-top:10px}
#score .t{border:2px solid #fff;padding:8px;min-width:150px;text-align:center}
#score .t div{margin-bottom:6px}
#score input{width:100px;padding:4px;font:inherit;color:var(--ink)}
#stage img{max-height:40vh;max-width:90%;border:3px solid #fff}
.mx{display:inline-grid;grid-template-columns:auto auto;gap:4px 18px;position:relative;padding:4px 22px;margin-top:10px}
.mx::before,.mx::after{content:"";position:absolute;top:0;bottom:0;width:9px;border:3px solid #fff}
.mx::before{left:0;border-right:0}
.mx::after{right:0;border-left:0}
.wager{color:var(--ink);padding:6px;width:140px;font:inherit;font-size:20px;text-align:center}
</style>
</head>
<body>
<header><h1>QURISE Quantum Jeopardy</h1><div class="row"><button id="final">Final Jeopardy</button><button id="reset">New game</button></div></header>
<main><div id="board"></div></main>
<div id="teams"></div>
<div id="ov"><div class="top"><span id="info"></span><button id="close">Close</button></div><div id="stage"></div><div id="score"></div></div>

/* ================================= */

const $=id=>document.getElementById(id);
let teams, used, dd, cur;

function init(){
  teams=GAME.teams.map(n=>({name:n,score:0}));
  used=new Set();
  const keys=[];
  GAME.categories.forEach((c,i)=>c.clues.forEach((_,j)=>keys.push(i+"-"+j)));
  dd=new Set();
  while(dd.size<Math.min(2,keys.length)) dd.add(keys[Math.floor(Math.random()*keys.length)]);
  drawBoard();drawTeams();
}
function drawBoard(){
  const b=$("board");b.innerHTML="";
  const cols=GAME.categories.length;b.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  GAME.categories.forEach(c=>{const d=document.createElement("div");d.className="cat";d.textContent=c.name;b.appendChild(d)});
  const rows=Math.max(...GAME.categories.map(c=>c.clues.length));
  for(let j=0;j<rows;j++)GAME.categories.forEach((c,i)=>{
    const cl=c.clues[j];const t=document.createElement("button");
    if(!cl){t.disabled=true;t.className="tile used";b.appendChild(t);return}
    const k=i+"-"+j;t.className="tile"+(used.has(k)?" used":"");t.textContent="$"+cl.v;
    t.onclick=()=>{ if(used.has(k)){used.delete(k);drawBoard()} else open(i,j) };
    b.appendChild(t);
  });
}
function drawTeams(){
  const t=$("teams");t.innerHTML="";
  teams.forEach((m,i)=>{
    const d=document.createElement("div");d.className="team";
    d.innerHTML=`<input class="name" value="${m.name.replace(/"/g,"&quot;")}"><div class="score">${fmt(m.score)}</div>
    <div class="row"><button data-d="-100">-100</button><button data-d="100">+100</button><button data-d="-500">-500</button><button data-d="500">+500</button></div>`;
    d.querySelector("input").onchange=e=>{m.name=e.target.value;drawTeams()};
    d.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{m.score+=+btn.dataset.d;drawTeams()});
    t.appendChild(d);
  });
  const add=document.createElement("button");add.textContent="+ Team";add.onclick=()=>{teams.push({name:"Team "+(teams.length+1),score:0});drawTeams()};t.appendChild(add);
  const rem=document.createElement("button");rem.textContent="- Team";rem.onclick=()=>{if(teams.length>1){teams.pop();drawTeams()}};t.appendChild(rem);
}
const fmt=n=>(n<0?"-$":"$")+Math.abs(n);

function open(i,j){
  const c=GAME.categories[i],cl=c.clues[j],k=i+"-"+j;
  cur={key:k,cl,isDD:dd.has(k),final:false,step:cl&&dd.has(k)?0:1};
  $("info").textContent=c.name+" - $"+cl.v;
  show();
}
function openFinal(){
  cur={final:true,cl:GAME.final,step:0};
  $("info").textContent="Final Jeopardy - "+GAME.final.category;
  show();
}
/* steps: 0 = DD wager / final category, 1 = clue, 2 = answer */
function show(){
  const s=$("stage");$("ov").classList.add("on");
  let h="";
  if(cur.step===0){
    if(cur.final) h=`<div class="txt">${GAME.final.category}</div><div class="hint">Teams set their wagers, then click to show the clue</div>`;
    else h=`<div class="txt">Daily Double!</div><input class="wager" id="wg" type="number" placeholder="Wager" onclick="event.stopPropagation()"><div class="hint">Enter a wager, then click to show the clue</div>`;
  } else if(cur.step===1){
    h=`<div class="txt">${cur.cl.q}</div>${cur.cl.img?'<img src="'+cur.cl.img+'">':''}<div class="hint">Click to show the answer</div>`;
  } else {
    h=`<div class="txt">${cur.cl.q}</div>${cur.cl.img?'<img src="'+cur.cl.img+'">':''}<div class="ans">${cur.cl.a}</div><div class="hint">Click Close to mark as used</div>`;
  }
  s.innerHTML=h;
  s.onclick=()=>{ if(cur.step<2){ if(cur.step===0&&!cur.final){cur.wager=Math.abs(+($("wg").value)||0)} cur.step++; show() } };
  drawScore();
}
function drawScore(){
  const el=$("score");el.innerHTML="";
  if(cur.step===0&&!cur.final){return}
  if(cur.final&&cur.step<2&&false){return}
  teams.forEach((m,i)=>{
    const d=document.createElement("div");d.className="t";
    const amt=cur.final?null:(cur.isDD?(cur.wager||0):cur.cl.v);
    d.innerHTML=`<div>${m.name}: ${fmt(m.score)}</div>`;
    if(cur.final){
      const w=document.createElement("input");w.type="number";w.placeholder="Wager";w.value=(cur.w&&cur.w[i])||"";
      w.oninput=()=>{cur.w=cur.w||{};cur.w[i]=Math.abs(+w.value||0)};d.appendChild(w);d.appendChild(document.createElement("br"));
    }
    const ok=document.createElement("button"),no=document.createElement("button");
    ok.textContent=cur.final?"Correct":"+"+(amt);no.textContent=cur.final?"Wrong":"-"+(amt);
    const apply=sign=>{const a=cur.final?((cur.w&&cur.w[i])||0):amt;m.score+=sign*a;drawScore2()};
    ok.onclick=()=>apply(1);no.onclick=()=>apply(-1);
    d.appendChild(ok);d.appendChild(no);el.appendChild(d);
  });
}
function drawScore2(){ // refresh score labels without losing wagers
  const labels=document.querySelectorAll("#score .t > div");
  teams.forEach((m,i)=>{labels[i].textContent=m.name+": "+fmt(m.score)});drawTeams();
}
$("close").onclick=()=>{
  $("ov").classList.remove("on");
  if(!cur.final&&cur.step>0)used.add(cur.key);
  drawBoard();drawTeams();
};
$("final").onclick=openFinal;
$("reset").onclick=()=>{if(confirm("Start a new game? Scores and used tiles reset, and Daily Doubles are re-picked."))init()};
init();
</script>
</body>
</html>
